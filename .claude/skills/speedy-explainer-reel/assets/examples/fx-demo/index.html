<!doctype html>
<html><head><meta charset="utf-8"><title>fx kit demo — advanced editing</title>
<link rel="stylesheet" href="../../template/speedy.css"><link rel="stylesheet" href="../../template/fx.css">
<style>
#cam{position:absolute;inset:0}
.dm-sc{position:absolute;inset:0;opacity:0}
.dm-lbl{position:absolute;left:0;right:0;top:250px;text-align:center;font:800 30px Mono;letter-spacing:4px;color:#F5B49C}
.dm-big{position:absolute;left:0;right:0;top:700px;text-align:center;font:900 120px/1 Inter;color:#fff;perspective:900px;letter-spacing:-3px}
.dm-card{position:absolute;left:140px;right:140px;top:1050px;height:220px;border-radius:30px;background:linear-gradient(135deg,#1E2230,#141620);border:1.5px solid #2E3446;overflow:hidden;display:grid;place-items:center;font:800 44px Inter;color:#fff;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.dm-odo{position:absolute;left:0;right:0;top:760px;text-align:center;font:900 190px/1 Inter;color:#fff;letter-spacing:-4px}
.dm-odo small{display:block;font:700 34px Mono;color:#9AA0A8;letter-spacing:3px;margin-top:20px}
.dm-codecard{position:absolute;left:90px;right:90px;top:620px;height:560px;border-radius:26px;background:#0D1117;border:1.5px solid #30363D;padding:30px 34px;box-sizing:border-box;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.dm-flip{position:absolute;left:150px;width:780px;top:620px;height:640px}
.dm-ui{width:100%;height:100%;background:linear-gradient(160deg,#2B1C3D,#14121C);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;border:2px solid #3A2C50}
.dm-ui b{font:900 64px Inter;color:#fff}.dm-ui span{display:flex;gap:10px}
.dm-ui span i{width:96px;height:70px;border-radius:14px}
.dm-back{background:#0D1117;border:2px solid #30363D;padding:34px;box-sizing:border-box}
.dm-item{position:absolute;left:140px;right:140px;top:700px;height:520px;border-radius:34px;display:grid;place-items:center;font:900 90px Inter;color:#fff}
.dm-phone{position:absolute;left:340px;top:600px;width:400px;height:780px;border-radius:60px;background:#0B0C0F;border:10px solid #2A2D33;box-shadow:0 40px 90px rgba(0,0,0,.6);display:grid;place-items:center}
.dm-phone i{width:300px;height:560px;border-radius:30px;background:linear-gradient(160deg,#3B82F6,#7C3AED)}
.dm-inside{position:absolute;inset:0;background:linear-gradient(160deg,#3B82F6,#7C3AED);display:grid;place-items:center;font:900 96px Inter;color:#fff;text-align:center}
.dm-done{position:absolute;left:0;right:0;top:820px;text-align:center;font:900 150px Inter;color:#3ECF8E}
.dm-scr{position:absolute;left:60px;right:60px;top:820px;text-align:center;font:800 64px Mono;color:#fff}
.dm-beats{position:absolute;left:120px;right:120px;top:780px;display:flex;gap:20px}
.dm-beats i{flex:1;height:300px;border-radius:24px;background:#3B82F6}
</style></head>
<body><div id="stage">
  <div class="s-bg"></div><div class="s-vig"></div>
  <div id="cam">
    <section class="dm-sc" id="s1"><div class="dm-lbl">LETTERS · SHEEN · CAMERA DRIFT</div><div class="dm-big" id="big"></div><div class="dm-card" id="card">canwe.ai editing kit</div></section>
    <section class="dm-sc" id="s2"><div class="dm-lbl">ODOMETER</div><div class="dm-odo"><span id="odo"></span><small>FRAMES RENDERED</small></div></section>
    <section class="dm-sc" id="s3"><div class="dm-lbl">CODE TYPING · GLITCH</div><div class="dm-codecard" id="cc"><div class="fx-code" id="code"></div></div></section>
    <section class="dm-sc" id="s4"><div class="dm-lbl">3D FLIP REVEAL</div>
      <div class="dm-flip fx-flip" id="flip"><div class="fx-card"><div class="fx-front dm-ui"><b>This reel</b><span><i style="background:#E11D48"></i><i style="background:#F59E0B"></i><i style="background:#10B981"></i></span></div>
        <div class="fx-back dm-back"><div class="fx-code" id="code2"></div></div></div></div></section>
    <section class="dm-sc" id="s5"><div class="dm-lbl">WHIP PAN</div><div class="dm-item" id="w1" style="background:#E11D48">#1</div><div class="dm-item" id="w2" style="background:#3B82F6">#2</div></section>
    <section class="dm-sc" id="s6"><div class="dm-lbl">ZOOM-THROUGH</div><div id="zo"><div class="dm-phone"><i></i></div></div><div class="dm-inside" id="zi">inside the<br>screen</div></section>
    <section class="dm-sc" id="s7"><div class="dm-lbl">FLASH · SHAKE · BURST</div><div class="dm-done" id="done">DONE ✓</div><div class="fx-burst" id="bst" style="left:540px;top:900px"></div></section>
    <section class="dm-sc" id="s8"><div class="dm-lbl">SCRAMBLE · LIGHT LEAK</div><div class="dm-scr" id="scr"></div></section>
    <section class="dm-sc" id="s9"><div class="dm-lbl">BEAT PULSE (136 BPM)</div><div class="dm-beats" id="bt"><i></i><i style="background:#7C3AED"></i><i style="background:#EE2A7B"></i></div></section>
  </div>
  <div id="grain"></div><div id="fxOverlay"></div>
</div>
<script src="../../template/engine.js"></script><script src="../../template/fx.js"></script>
<script>
const R = Reel, F = R.fx, { prog, clamp } = R, $ = R.$;
window.REEL_DURATION = 23;
const SC = [["s1", 0, 3.2], ["s2", 3.2, 5.6], ["s3", 5.6, 8.2], ["s4", 8.2, 11.2], ["s5", 11.2, 13.4], ["s6", 13.4, 16], ["s7", 16, 18.2], ["s8", 18.2, 20.6], ["s9", 20.6, 23]];
F.beats({ bpm: 136, groove_in: 20.6, dur: 23 });
const SRC = `// one scene = one web page\nconst scene = R.fx.cam("stage", t, keys);\nawait render("reel.mp4", { fps: 30 });\n// 1411 frames, no editor`;
window.seek = t => {
  SC.forEach(([id, a, b]) => { const e = $(id); e.style.opacity = t >= a && t < b ? 1 : 0; });
  F.cam("cam", t, [{ t: 0, s: 1.06, ry: -6 }, { t: 3, s: 1, ry: 0 }, { t: 23, s: 1.02 }], { drift: true });
  // 1 letters + sheen
  F.letters("big", "ADVANCED", t, 0.2, { mode: "flip", stagger: 0.05 });
  F.sheen("card", t, 1.6);
  // 2 odometer
  F.odometer("odo", t, 3.35, 1.6, 1411);
  // 3 code + glitch
  F.code("code", SRC, t, 5.7, { cps: 60 });
  F.glitch("cc", t, 7.5, { d: 0.35 });
  // 4 flip
  F.code("code2", SRC, t, 9.3, { cps: 70, sfx: false });
  F.flip("flip", t, 8.7, { d: 0.9 });
  // 5 whip
  F.whip("w1", "w2", t, 12.3, { dir: -1 });
  // 6 zoom-through into the phone screen
  F.zoomThrough("zo", "zi", t, 14.6, { origin: [540, 990] });
  // 7 flash + shake + burst
  F.flash(t, 16.6); F.burst("bst", t, 16.6, { n: 22, r: 300 });
  const dp = prog(t, 16.55, 0.45); $("done").style.transform = `scale(${R.lerp(2.2, 1, R.ease.spring(dp))})`; $("done").style.opacity = clamp(dp * 4);
  F.shake("s7", t, 16.6, { amp: 22 });
  // 8 scramble + leak
  F.scramble("scr", "every frame is code", t, 18.4, { d: 1.1 });
  F.leak(t, 19.8, { d: 0.9 });
  // 9 beat pulse
  const pl = F.pulse(t); document.querySelectorAll("#bt i").forEach((b, i) => b.style.transform = `scaleY(${1 + 0.35 * pl * (1 - i * 0.2)})`);
};
window.seek(0);
</script></body></html>
