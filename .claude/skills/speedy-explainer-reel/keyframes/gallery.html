<!doctype html><html><head><meta charset="utf-8"><title>Keyframes gallery</title><link rel="stylesheet" href="kf.css"><style>
body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0c0c0f;font-family:Inter}
#stage{position:absolute;inset:0}
#name{position:absolute;left:60px;top:150px;padding:10px 22px;border-radius:999px;background:#D97757;color:#1a0e08;font:700 30px "JetBrains Mono",monospace}
#idx{position:absolute;right:60px;top:160px;font:700 28px "JetBrains Mono",monospace;color:#8b8f98}
#line{position:absolute;left:60px;right:60px;top:220px;font:800 44px/1.15 Inter;color:#F3F1EC}
.slot{position:absolute;left:0;top:340px;width:1080px;height:1000px;overflow:hidden}
#foot{position:absolute;left:60px;top:1370px;font:600 26px Inter;color:#8b8f98}
</style></head><body><div id="stage"><div id="name"></div><div id="idx"></div><div id="line"></div><div id="foot">canwe.ai keyframes</div></div>
<script src="kf.js"></script><script src="manifest.js"></script><script src="../assets/template/avatar.js"></script>
<script>KF_MANIFEST.forEach(([g, n]) => { if (n !== "loop-back") document.write('<script src="' + n + '/block.js"><\/script>'); }); KF_MANIFEST.forEach(([g, n]) => document.write('<script src="' + n + '/demo.js"><\/script>'));</script>
<script>
// gallery.html            → every block in turn      gallery.html?only=wave-cancel → one block on a loop
const Q = new URLSearchParams(location.search), only = Q.get("only"), grp = Q.get("group"), GM = Object.fromEntries(KF_MANIFEST.map(([g, n]) => [n, g])), D = KF.demos.filter(d => (!only || d.name === only) && (!grp || grp.includes(GM[d.name]))), stage = document.getElementById("stage");
let acc = 0; D.forEach((d, i) => { d.t0 = acc; acc += d.dur; d.slot = KF.el("div", "slot", stage); d.frame = d.build(d.slot); d.i = i; });
window.REEL_DURATION = acc; window.KF_INDEX = D.map(d => ({ name: d.name, t0: d.t0, dur: d.dur }));
window.seek = t => { t = Math.max(0, Math.min(acc - 1e-4, t)); const d = D.reduce((b, x) => (t >= x.t0 ? x : b), D[0]);
  D.forEach(x => (x.slot.style.display = x === d ? "" : "none")); document.getElementById("name").textContent = GM[d.name] + " · " + d.name; document.getElementById("idx").textContent = (d.i + 1) + " / " + D.length; document.getElementById("line").textContent = d.line; d.frame(t - d.t0); };
window.seek(0);
</script></body></html>
