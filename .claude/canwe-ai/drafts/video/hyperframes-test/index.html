<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { --ground: #0F0F11; --ink: #F3F1EC; --acc: #D97757; --mute: #8A877F; --font-display: "Inter", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-display); color: var(--ink); }
      .line { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; letter-spacing: -0.04em; }
      #l1 { top: 520px; font-size: 104px; }
      #l2 { top: 640px; font-size: 104px; color: var(--mute); }
      #strike { position: absolute; left: 150px; top: 700px; width: 780px; height: 12px; border-radius: 6px; background: var(--acc); transform-origin: 0 50%; }
      #logo { position: absolute; left: 440px; top: 860px; width: 200px; height: 200px; }
      #l3 { top: 1100px; font-size: 88px; }
      #l3 b { color: var(--acc); }
      .step { position: absolute; left: 140px; width: 800px; height: 92px; border-radius: 22px; background: #1B1B1F; border: 1.5px solid #2C2C31; font: 700 40px var(--font-display); display: flex; align-items: center; gap: 22px; padding: 0 30px; }
      .step i { font-style: normal; color: var(--acc); font-weight: 900; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920" data-layout-allow-overlap>
              <div id="l1" class="clip line" data-start="0" data-duration="3.4" data-track-index="0">Stop paying for</div>
        <div id="l2" class="clip line" data-start="0" data-duration="3.4" data-track-index="1">editing courses.</div>
        <div id="strike" data-layout-allow-occlusion class="clip" data-start="0" data-duration="3.4" data-track-index="2"></div>
        <img id="logo" class="clip" data-start="0" data-duration="3.4" data-track-index="3" src="assets/claude.svg" alt="Claude" />
        <div id="l3" class="clip line" data-start="0" data-duration="3.4" data-track-index="4">Claude makes <b>the reel.</b></div>
              <div class="clip step" id="s1" data-start="3.4" data-duration="4.6" data-track-index="5" style="top:560px"><i>01</i>Idea</div>
        <div class="clip step" id="s2" data-start="3.4" data-duration="4.6" data-track-index="6" style="top:672px"><i>02</i>Script</div>
        <div class="clip step" id="s3" data-start="3.4" data-duration="4.6" data-track-index="7" style="top:784px"><i>03</i>Voice</div>
        <div class="clip step" id="s4" data-start="3.4" data-duration="4.6" data-track-index="8" style="top:896px"><i>04</i>Video · HyperFrames</div>
        <div class="clip step" id="s5" data-start="3.4" data-duration="4.6" data-track-index="9" style="top:1008px"><i>05</i>Captions + post</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#l1", { scale: 1.08 }, { scale: 1, duration: 0.6, ease: "power4.out" }, 0)
        .fromTo("#l2", { y: 60, opacity: 0.25 }, { y: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 0.05)
        .fromTo("#strike", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 0.9)
        .fromTo("#logo", { scale: 0, rotation: -120, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.7, ease: "back.out(2.2)" }, 1.4)
        .to("#logo", { rotation: 90, duration: 1.3, ease: "power2.inOut" }, 2.15)
        .fromTo("#l3", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 1.75)
        .to(["#l1", "#l2", "#strike", "#logo", "#l3"], { y: -80, opacity: 0, duration: 0.3, ease: "power3.in", stagger: 0.03 }, 3.05);
      ["#s1", "#s2", "#s3", "#s4", "#s5"].forEach((s, i) => tl.fromTo(s, { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 3.5 + i * 0.22));
      tl.to("#s4", { scale: 1.06, borderColor: "#D97757", duration: 0.4, ease: "power2.out" }, 5.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
