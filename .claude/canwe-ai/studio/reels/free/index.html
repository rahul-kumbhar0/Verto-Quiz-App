<!doctype html><html><head><meta charset="utf-8"><title>FREE: free-claude-code</title>
<link rel="stylesheet" href="kf/kf.css"><style>
body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0c0c0f;font-family:Inter}
#stage{position:absolute;inset:0}
.scene{position:absolute;left:0;top:520px;width:1080px;height:760px}
#fn{position:absolute;left:0;right:0;top:1206px;text-align:center;font:600 24px "JetBrains Mono",monospace;color:#8b8f98}
#red{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 45%,#3a1214,#0c0c0f 70%);opacity:0}
</style></head><body><div id="stage">
  <div id="red"></div>
  <div id="world" style="position:absolute;inset:0">
  <div id="s1" class="scene kf-host"></div><div id="s2" class="scene kf-host"></div><div id="s3" class="scene kf-host"></div><div id="s4" class="scene kf-host"></div>
  <div id="s5" class="scene kf-host"></div><div id="s6" class="scene kf-host" style="top:440px;height:900px"></div>
  <div id="pipe" class="scene kf-host"></div>
  <div id="rackh" class="scene kf-host"></div>
  </div>
  <div id="wipe2" class="kf-host" style="left:0;top:0;width:1080px;height:1920px"></div>
  <div id="wipe" class="kf-host" style="left:0;top:0;width:1080px;height:1920px"></div>
  <div id="rail" class="kf-host" style="left:0;top:296px;width:1080px;height:100px"></div>
  <div id="cap" class="kf-host" style="left:0;top:390px;width:1080px;height:140px;overflow:visible"></div>
  <div id="fn" data-qa="ok"></div>
  <div id="pres" class="kf-host" style="left:0;top:1290px;width:1080px;height:630px"></div>
  <div id="fin" class="kf-host" style="left:0;top:0;width:1080px;height:1920px;pointer-events:none"></div>
</div>
<script src="kf/kf.js"></script><script src="kf/avatar.js"></script><script src="words.js"></script>
<script>["captions","presenter","chapter-rail","hero-stat","repo-card","flow-nodes","tracked-labels","agent-log","strike-row","ending-comment","light-wipe","props","finish","real-screen"].forEach(n => document.write('<script src="kf/' + n + '/block.js"><\/script>'));</script>
<script>
// ---- word clock ----
const W = window.WORDS.filter(w => (w.type || "word") === "word").map(w => ({ w: w.text, s: w.start, e: w.end }));
const at = (word, n = 1) => { let k = 0; for (const x of W) if (x.w.replace(/[.,!?]/g, "").toLowerCase() === word.toLowerCase() && ++k === n) return x.s; throw new Error("no word " + word + " #" + n); };
const END = W[W.length - 1].e, DUR = +(END + 1.6).toFixed(2); window.REEL_DURATION = DUR;
const P = KF.prog, E = KF.ease, $ = id => document.getElementById(id), C = KF.C;
const T = { starred: at("starred"), free1: at("free", 1), heres: at("Here's", 1), answering: at("answering"), s1: at("Step", 1), repo: at("GitHub"), fcc: at("Free", 3),
  s2: at("Step", 2), key: at("key"), nvidia: at("NVIDIA"), google: at("Google"), groq: at("Groq"), s3: at("Step", 3), open: at("Open"), same: at("Same", 1), zero: at("zero"), bill: at("bill"),
  catch: at("catch"), brain: at("brain"), notclaude: at("Claude", 4), model: at("model"), weaker: at("weaker"), code: at("code", 4), company: at("company"), privat: at("private"), off: at("off"), cta: at("Comment"), dm: at("DM") };
const S = { s1: [0, T.s1 - 0.1], s2: [T.s1 - 0.1, T.s2 - 0.1], s3: [T.s2 - 0.1, T.s3 - 0.1], s4: [T.s3 - 0.1, T.catch - 0.15], s5: [T.catch - 0.15, T.cta - 0.1], s6: [T.cta - 0.1, DUR] };

// ---- blocks ----
const cap = KF.make("captions", "cap", { words: W, keys: ["free.", "answering.", "Code.", "Groq.", "bill!", "catch.", "weaker.", "it.", "FREE,"], max: 4, size: 62 });
const pres = KF.make("presenter", "pres", { w: 560, y: 40, style: { shirt: "#1D1E23", shirtLine: "#0B0C0F", print: "#D97757", chain: "#F2C14E", lens1: "#F0A585", lens2: "#D97757" },
  poses: [[0, "point_cam"], [T.heres - 0.1, "think"], [T.s1 - 0.1, "one"], [T.fcc - 0.1, "offer"], [T.s2 - 0.1, "two"], [T.nvidia - 0.1, "three"], [T.s3 - 0.1, "three"], [T.zero - 0.2, "thumbs"], [T.catch - 0.1, "stop"], [T.notclaude - 0.1, "shrug"], [T.company - 0.1, "cross"], [T.cta - 0.1, "point_cam"]],
  talk: W.map(x => [x.s - 0.02, x.e + 0.02]) });
const rail = KF.make("chapter-rail", "rail", { steps: ["the claim", "step 1", "step 2", "step 3", "catch"], top: 0 });
const wipe = KF.make("light-wipe", "wipe", { color: "#7fd0ff" }), wipe2 = KF.make("light-wipe", "wipe2", { color: "#ffd8a8" }), fin = KF.make("finish", "fin", { grain: 0.55, vignette: 0.45 });
// S1 hook: the star count
const stat = KF.make("hero-stat", "s1", { from: 0, to: 69411, icon: "star", label: "people starred this on GitHub", top: 60, size: 150, glow: C.gold, color: "#F3F1EC" });
// "what's actually answering?": the app, and a question mark where the brain should be
const pipe = KF.make("flow-nodes", "pipe", { nodes: [{ id: "app", label: "Claude Code", sub: "the app you open", x: 540, y: 70, color: C.accent, at: T.heres + 0.2 }], edges: [] });
const qm = KF.el("div", "", $("pipe"), "?"); qm.style.cssText = "position:absolute;left:470px;top:230px;width:140px;height:140px;border-radius:36px;border:5px dashed #8b8f98;display:grid;place-items:center;font:900 90px Inter;color:#8b8f98";
// REAL SCREENS (screenshots taken 13 Nov 2026 / the project's own README images)
const gh = KF.make("real-screen", "s2", { src: "real/gh-full.png", natural: [860, 12000], frame: "phone", w: 600, vh: 590, top: 0 });
const nv = KF.make("real-screen", "s3", { src: "real/nvidia-desktop.png", natural: [1280, 800], frame: "browser", url: "build.nvidia.com", w: 960, top: 20 });
const adm = KF.make("real-screen", "s3", { src: "real/admin-page.png", natural: [1272, 716], frame: "window", w: 980, top: 40 });
const cc = KF.make("real-screen", "s4", { src: "real/pic.png", natural: [1713, 910], frame: "window", w: 980, top: 20 });
const bill = KF.make("hero-stat", "s4", { from: 0, to: 0, icon: "rupee", label: "bill", top: 548, size: 96, glow: C.green, look: "glow" });
const picker = KF.make("real-screen", "s5", { src: "real/cc-model-picker.png", natural: [1723, 915], frame: "window", w: 980, top: 40 });
const rack = KF.make("props", "rackh", { kind: "rack", size: 380, y: 270 }), rackTag = KF.el("div", "", $("rackh"), "the company you pick"); rackTag.style.cssText = "position:absolute;left:0;right:0;top:520px;text-align:center;font:800 34px Inter;color:#ff8a8a";
const keep = KF.make("strike-row", "s5", { size: 150, top: 440, items: [{ art: "laptop", label: "private code", at: T.privat - 0.25, strike: T.privat + 0.2 }, { icon: "🎓", label: "practice projects", at: T.privat - 0.05, tick: T.off }] });
const cta = KF.make("ending-comment", "s6", { keyword: "FREE", pill: "for the setup + exact settings", dm: "Free Claude Code: setup, keys and settings 👇" });

// ---- sound cues ----
const cues = []; const cue = (type, t, o = {}) => cues.push({ type, t: +t.toFixed(3), ...o });
cue("riser", 0.05, { t2: 1.4 }); for (let k = 0; k < 10; k++) cue("tick", 0.2 + k * 0.12, { soft: true }); cue("impact", T.free1); cue("whoosh", T.heres); cue("pop", T.heres + 0.2); cue("pop", T.heres + 0.4, { soft: true });
cue("whoosh", S.s2[0]); cue("land", S.s2[0] + 0.35); cue("pop", T.repo); cue("swish", T.fcc - 0.25); cue("ding", T.fcc + 0.45); cue("whoosh", S.s3[0]); cue("pop", T.key); cue("swish", T.nvidia - 0.3);
cue("tap", T.key); [T.nvidia, T.google, T.groq].forEach(x => { cue("pop", x); cue("swish", x + 0.2, { soft: true }); });
cue("whoosh", S.s4[0]); cue("pop", T.same); cue("pop", T.same + 0.7); cue("ding", T.bill);
cue("impact", T.catch); cue("swish", T.brain - 0.2); cue("glitch", T.notclaude); cue("swish", T.weaker, { soft: true }); cue("pop", T.code); cue("pop", T.code + 0.3); cue("glitch", T.privat + 0.1); cue("ding", T.off);
cue("swell", T.cta - 0.1); cue("type", T.cta + 0.4, { t2: T.cta + 0.8 }); cue("click", T.cta + 0.95); cue("ding", T.dm + 0.2);
W.forEach(x => { if (/[.!?]$/.test(x.w)) cue("tick", x.e + 0.02, { soft: true }); });
window.__cues = cues;

// ---- the frame ----
window.seek = t => {
  const on = k => t >= S[k][0] && t < S[k][1];
  ["s1", "s2", "s3", "s4", "s5", "s6"].forEach(k => { const e = $(k), a = S[k][0], b = S[k][1], v = on(k); e.style.display = v ? "" : "none";
    if (v) { const pin = E.out(P(t, a, 0.35)), pout = P(t, b - 0.25, 0.25); e.style.opacity = Math.min(pin * 1.4, 1 - pout); e.style.transform = `translateY(${((1 - pin) * 60 - pout * 40).toFixed(1)}px)`; } });
  $("red").style.opacity = P(t, T.catch - 0.15, 0.3) * (1 - P(t, T.cta - 0.2, 0.3));
  // hook: count up, then the question "what's actually answering?"
  if (on("s1")) { stat.frame(t, { p: P(t, 0.05, 3.3), show: 1 - P(t, T.heres - 0.2, 0.3) }); }
  const pv = t >= T.heres + 0.15 && t < S.s2[0], pe = $("pipe"); pe.style.display = pv ? "" : "none";
  if (pv) { pe.style.opacity = 1 - P(t, S.s2[0] - 0.25, 0.25); pipe.frame(t, { active: ["app"] }); qm.style.opacity = P(t, T.heres + 0.35, 0.3); qm.style.transform = `scale(${(1 + 0.06 * Math.sin(t * 6)).toFixed(3)})`; }
  // step one: the real GitHub page on a phone: the repo, its stars, then scroll to the real install command
  if (on("s2")) { const z = KF.keys(t, [[S.s2[0], 1.0], [T.repo - 0.4, 1.5, "inOut"], [T.fcc + 0.15, 1.5], [T.fcc + 0.8, 1.1, "inOut"]]), fy = KF.keys(t, [[S.s2[0], 420], [T.repo - 0.4, 365, "inOut"], [T.repo + 0.05, 365], [T.repo + 0.35, 1172, "inOut"], [T.fcc + 0.15, 1172], [T.fcc + 0.8, 7066, "inOut"]]), fx = KF.keys(t, [[T.repo + 0.05, 215], [T.repo + 0.35, 215], [T.fcc + 0.8, 430, "inOut"]]);
    gh.frame(t, { show: P(t, S.s2[0], 0.5), zoom: z, focus: [fx, fy], boxes: [
      { x: 26, y: 330, w: 390, h: 70, p: P(t, T.repo - 0.35, 0.3) * (1 - P(t, T.repo + 0.15, 0.15)), color: "#4b8bff", label: "the free repo" },
      { x: 24, y: 1146, w: 230, h: 54, p: P(t, T.repo + 0.35, 0.25) * (1 - P(t, T.fcc + 0.15, 0.2)), color: "#F2C14E", label: "69.4k stars" },
      { x: 60, y: 7008, w: 740, h: 122, p: P(t, T.fcc + 0.8, 0.3), color: "#3ECF8E", label: "1 · the install line", side: "top" } ] }); }
  // step two: the real NVIDIA page (free models), then the tool's real Admin page with the providers
  if (on("s3")) { const sw = T.key + 0.35, nvOn = t < sw + 0.2; nv.frame(t, { show: P(t, S.s3[0], 0.45) * (1 - P(t, sw, 0.25)), zoom: 1 + 0.12 * P(t, S.s3[0], 1.6), focus: [400, 520], boxes: [{ x: 90, y: 456, w: 520, h: 76, p: P(t, T.s2 + 0.35, 0.35), color: "#76b900", label: "free inference" }] });
    adm.frame(t, { show: P(t, sw, 0.45), zoom: KF.keys(t, [[sw, 1], [T.nvidia - 0.1, 1.3, "inOut"], [T.groq + 0.4, 1.3], [T.groq + 0.9, 1.1, "inOut"]]), focus: KF.keys(t, [[sw, [640, 380]], [T.nvidia - 0.1, [461, 551], "inOut"], [T.google - 0.15, [461, 551]], [T.google + 0.1, [1049, 190], "inOut"], [T.groq - 0.15, [1049, 190]], [T.groq + 0.1, [461, 370], "inOut"]]), boxes: [
      { x: 325, y: 484, w: 272, h: 134, p: P(t, T.nvidia - 0.05, 0.3), color: "#76b900", label: "NVIDIA", side: "bottom" }, { x: 908, y: 123, w: 282, h: 134, p: P(t, T.google - 0.05, 0.3), color: "#4b8bff", label: "Google", side: "bottom" }, { x: 325, y: 303, w: 272, h: 134, p: P(t, T.groq - 0.05, 0.3), color: "#F2C14E", label: "Groq", side: "bottom" } ] }); }
  wipe.frame(t, { p: P(t, S.s4[0] - 0.3, 0.55) }); wipe2.frame(t, { p: P(t, S.s2[0] - 0.3, 0.55) });
  const dr = fin.drift(t, 0.9); $("world").style.transform = `translate(${dr[0].toFixed(1)}px,${dr[1].toFixed(1)}px) rotate(${dr[2].toFixed(3)}deg)`;
  const rk = t >= T.code - 0.3 && t < T.privat - 0.35; $("rackh").style.display = rk ? "" : "none"; if (rk) { rack.frame(t, { show: P(t, T.code - 0.3, 0.4), p: KF.prog(t, T.code - 0.1, (T.privat - T.code) * 0.9) }); $("rackh").style.opacity = 1 - P(t, T.privat - 0.6, 0.25); rackTag.style.opacity = P(t, T.company - 0.1, 0.3); }
  if (on("s4")) { cc.frame(t, { show: P(t, S.s4[0], 0.45), zoom: KF.keys(t, [[S.s4[0], 1.05], [T.same - 0.1, 1.45, "inOut"], [T.same + 0.5, 1.45], [T.same + 0.9, 1.3, "inOut"], [T.zero - 0.2, 1.1, "inOut"]]), focus: KF.keys(t, [[S.s4[0], [856, 455]], [T.same - 0.1, [540, 170], "inOut"], [T.same + 0.5, [540, 170]], [T.same + 0.9, [600, 520], "inOut"], [T.zero - 0.2, [856, 455], "inOut"]]), boxes: [{ x: 28, y: 138, w: 1000, h: 52, p: P(t, T.same - 0.1, 0.35), color: "#4b8bff", label: "same app" }, { x: 28, y: 424, w: 1110, h: 196, p: P(t, T.same + 0.6, 0.35), color: "#4b8bff", label: "same commands", side: "bottom" }] }); bill.frame(t, { p: 1, show: E.back(P(t, T.zero - 0.15, 0.3)) }); }
  if (on("s5")) { const z = E.inOut(P(t, T.brain - 0.2, 0.9)); picker.frame(t, { show: P(t, S.s5[0], 0.4) * (1 - P(t, T.code - 0.4, 0.3)), zoom: 1 + 0.7 * z, focus: [520, KF.lerp(560, 752, z)], boxes: [{ x: 16, y: 734, w: 980, h: 44, p: P(t, T.notclaude - 0.15, 0.35), color: "#ff4d4d", label: "NOT CLAUDE: a free model", side: "top" }] }); keep.frame(t); }
  if (on("s6")) cta.frame(t, { show: P(t, S.s6[0], 0.6), typed: P(t, T.cta + 0.4, 0.4), sent: P(t, T.cta + 0.9, 0.3), dm: P(t, T.dm + 0.1, 0.9) });
  const lb = KF.loopBack(t, DUR, 1.0); if (lb.mix > 0) { const e = $("s1"); e.style.display = ""; e.style.opacity = lb.mix; e.style.transform = "none"; stat.frame(0, { p: 1, show: 1 }); $("s6").style.opacity = 1 - lb.mix; }
  const ch = t < S.s2[0] ? 0.5 : t < S.s2[0] + (T.s2 - S.s2[0]) ? 1.5 : t < S.s4[0] ? 2.5 : t < S.s5[0] ? 3.5 : 4.5;
  rail.frame(t, { at: Math.min(ch, 4.9), alert: on("s5"), value: t < S.s2[0] ? 69411 : t < T.s2 ? 1 : t < S.s4[0] ? [T.nvidia, T.google, T.groq].filter(x => t >= x).length : t < S.s5[0] ? 0 : 2,
    label: t < S.s2[0] ? "★ stars" : t < T.s2 ? "repo" : t < S.s4[0] ? "free keys" : t < S.s5[0] ? "₹ bill" : "catches" });
  $("rail").style.opacity = t >= S.s6[0] ? 1 - P(t, S.s6[0], 0.3) : 1;
  cap.frame(t); pres.frame(t); fin.frame(t, { flash: Math.max(0, 0.22 * (1 - P(t, T.privat + 0.36, 0.12)) * (t >= T.privat + 0.36 ? 1 : 0)) });
  $("fn").textContent = t < S.s2[0] ? "★ checked 13 Nov 2026 · not affiliated with Anthropic" : on("s2") ? "Real screenshot: github.com/Alishahryar1/free-claude-code" : on("s3") ? (t < T.key + 0.55 ? "Real screenshot: build.nvidia.com" : "Real screenshot from the project's README (Admin page)") : on("s4") ? (t < T.zero - 0.25 ? "Real screenshot from the project's README" : "") : on("s5") ? (t < T.code - 0.3 ? "Real screenshot from the project's README (/model picker)" : "Pick a provider whose data rules you're OK with") : "";
};
window.seek(0);
</script></body></html>
