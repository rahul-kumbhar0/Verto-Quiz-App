<!doctype html><html><head><meta charset="utf-8"><title>FREE: free-claude-code</title>
<link rel="stylesheet" href="kf/kf.css"><style>
body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0c0c0f;font-family:Inter}
#stage{position:absolute;inset:0}
.scene{position:absolute;left:0;top:520px;width:1080px;height:760px}
#fn{position:absolute;left:0;right:0;top:1206px;text-align:center;font:600 24px "JetBrains Mono",monospace;color:#8b8f98}
#red{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 45%,#3a1214,#0c0c0f 70%);opacity:0}
</style></head><body><div id="stage">
  <div id="red"></div>
  <div id="world" style="position:absolute;inset:0">
  <div id="s1" class="scene kf-host"></div><div id="s2" class="scene kf-host"></div><div id="s3" class="scene kf-host"></div><div id="s4" class="scene kf-host"></div>
  <div id="s5" class="scene kf-host"></div><div id="s6" class="scene kf-host" style="top:440px;height:900px"></div>
  <div id="pipe" class="scene kf-host"></div>
  <div id="rackh" class="scene kf-host"></div>
  </div>
  <div id="wipe2" class="kf-host" style="left:0;top:0;width:1080px;height:1920px"></div>
  <div id="wipe" class="kf-host" style="left:0;top:0;width:1080px;height:1920px"></div>
  <div id="rail" class="kf-host" style="left:0;top:296px;width:1080px;height:100px"></div>
  <div id="cap" class="kf-host" style="left:0;top:390px;width:1080px;height:140px;overflow:visible"></div>
  <div id="fn" data-qa="ok"></div>
  <div id="pres" class="kf-host" style="left:0;top:1290px;width:1080px;height:630px"></div>
  <div id="fin" class="kf-host" style="left:0;top:0;width:1080px;height:1920px;pointer-events:none"></div>
</div>
<script src="kf/kf.js"></script><script src="kf/avatar.js"></script><script src="words.js"></script>
<script>["captions","presenter","chapter-rail","hero-stat","repo-card","flow-nodes","tracked-labels","agent-log","strike-row","ending-comment","light-wipe","props","finish"].forEach(n => document.write('<script src="kf/' + n + '/block.js"><\/script>'));</script>
<script>
// ---- word clock ----
const W = window.WORDS.filter(w => (w.type || "word") === "word").map(w => ({ w: w.text, s: w.start, e: w.end }));
const at = (word, n = 1) => { let k = 0; for (const x of W) if (x.w.replace(/[.,!?]/g, "").toLowerCase() === word.toLowerCase() && ++k === n) return x.s; throw new Error("no word " + word + " #" + n); };
const END = W[W.length - 1].e, DUR = +(END + 1.6).toFixed(2); window.REEL_DURATION = DUR;
const P = KF.prog, E = KF.ease, $ = id => document.getElementById(id), C = KF.C;
const T = { starred: at("starred"), free1: at("free", 1), heres: at("Here's", 1), answering: at("answering"), s1: at("Step", 1), repo: at("GitHub"), fcc: at("Free", 3),
  s2: at("Step", 2), key: at("key"), nvidia: at("NVIDIA"), google: at("Google"), groq: at("Groq"), s3: at("Step", 3), open: at("Open"), same: at("Same", 1), zero: at("zero"), bill: at("bill"),
  catch: at("catch"), brain: at("brain"), notclaude: at("Claude", 4), model: at("model"), weaker: at("weaker"), code: at("code", 4), company: at("company"), privat: at("private"), off: at("off"), cta: at("Comment"), dm: at("DM") };
const S = { s1: [0, T.s1 - 0.1], s2: [T.s1 - 0.1, T.s3 - 0.1], s4: [T.s3 - 0.1, T.catch - 0.15], s5: [T.catch - 0.15, T.cta - 0.1], s6: [T.cta - 0.1, DUR] };

// ---- blocks ----
const cap = KF.make("captions", "cap", { words: W, keys: ["free.", "answering.", "Code.", "Groq.", "bill!", "catch.", "weaker.", "it.", "FREE,"], max: 4, size: 62 });
const pres = KF.make("presenter", "pres", { w: 560, y: 40, style: { shirt: "#1D1E23", shirtLine: "#0B0C0F", print: "#D97757", chain: "#F2C14E", lens1: "#F0A585", lens2: "#D97757" },
  poses: [[0, "point_cam"], [T.heres - 0.1, "think"], [T.s1 - 0.1, "one"], [T.fcc - 0.1, "offer"], [T.s2 - 0.1, "two"], [T.nvidia - 0.1, "three"], [T.s3 - 0.1, "three"], [T.zero - 0.2, "thumbs"], [T.catch - 0.1, "stop"], [T.notclaude - 0.1, "shrug"], [T.company - 0.1, "cross"], [T.cta - 0.1, "point_cam"]],
  talk: W.map(x => [x.s - 0.02, x.e + 0.02]) });
const rail = KF.make("chapter-rail", "rail", { steps: ["the claim", "step 1", "step 2", "step 3", "catch"], top: 0 });
const wipe = KF.make("light-wipe", "wipe", { color: "#7fd0ff" }), wipe2 = KF.make("light-wipe", "wipe2", { color: "#ffd8a8" }), fin = KF.make("finish", "fin", { grain: 0.55, vignette: 0.45 });
// S1 hook: the star count
const stat = KF.make("hero-stat", "s1", { from: 0, to: 68932, icon: "star", label: "people starred this on GitHub", top: 60, size: 150, glow: C.gold, color: "#F3F1EC" });
// the hero: one pipeline that grows through steps 1–3 (Claude Code app → Free Claude Code on your laptop → free models)
const pipe = KF.make("flow-nodes", "pipe", { nodes: [
  { id: "app", label: "Claude Code", sub: "the app you open", x: 540, y: 70, color: C.accent, at: T.heres + 0.2 },
  { id: "fcc", label: "Free Claude Code", sub: "runs on your laptop", x: 540, y: 250, color: C.blue, at: T.fcc - 0.1, w: 420 },
  { id: "nv", label: "NVIDIA", sub: "free key", x: 230, y: 440, color: C.green, at: T.nvidia - 0.05, w: 270, h: 120 },
  { id: "go", label: "Google", sub: "free key", x: 540, y: 440, color: C.gold, at: T.google - 0.05, w: 270, h: 120 },
  { id: "gq", label: "Groq", sub: "free key", x: 850, y: 440, color: C.violet, at: T.groq - 0.05, w: 270, h: 120 } ],
  edges: [{ from: "app", to: "fcc", at: T.fcc + 0.3 }, { from: "fcc", to: "nv", at: T.nvidia + 0.2, color: C.green, bend: 30 }, { from: "fcc", to: "go", at: T.google + 0.2, color: C.gold }, { from: "fcc", to: "gq", at: T.groq + 0.2, color: C.violet, bend: -30 }] });
const qm = KF.el("div", "", $("pipe"), "?"); qm.style.cssText = "position:absolute;left:470px;top:190px;width:140px;height:140px;border-radius:36px;border:5px dashed #8b8f98;display:grid;place-items:center;font:900 90px Inter;color:#8b8f98";
const repo = KF.make("repo-card", "s2", { owner: "Alishahryar1", name: "free-claude-code", desc: "Claude Code + 11 apps, on free models.", stars: 68932, chips: ["AGPL", "12 apps", "61 providers"], top: 120 });
// S4 step three: a normal Claude Code session, answered by a free model
const sess = KF.make("agent-log", "s4", { prompt: "fix the login bug in app.js", top: 0, steps: [{ verb: "Read", obj: "app.js" }, { verb: "Edited", obj: "login()", meta: "+6 −2" }, { verb: "Ran", obj: "npm test", meta: "12 passed" }, { verb: "Model", obj: "nemotron (free)", meta: "via FCC" }] });
const bill = KF.make("hero-stat", "s4", { from: 0, to: 0, icon: "rupee", label: "bill", top: 410, size: 150, glow: C.green, look: "glow" });
// S5 catch: the brain is not Claude, and your code goes to the company you pick
const brain = KF.make("flow-nodes", "s5", { nodes: [{ id: "app", label: "Claude Code", sub: "the app", x: 540, y: 70, color: C.accent, at: T.catch }, { id: "m", label: "Free model", sub: "nemotron · gemini · llama", x: 540, y: 290, color: C.red, at: T.brain - 0.1, w: 440 }],
  edges: [{ from: "app", to: "m", at: T.brain + 0.2, color: C.red }] });
const lab = KF.make("tracked-labels", "s5", { size: 30, color: "#ff8a8a", labels: [{ text: "NOT CLAUDE", at: T.notclaude, out: T.code - 0.3, anchor: [320, 290], dx: -40, dy: -110 }] });
const rack = KF.make("props", "rackh", { kind: "rack", size: 380, y: 270 }), rackTag = KF.el("div", "", $("rackh"), "the company you pick"); rackTag.style.cssText = "position:absolute;left:0;right:0;top:520px;text-align:center;font:800 34px Inter;color:#ff8a8a";
const keep = KF.make("strike-row", "s5", { size: 150, top: 440, items: [{ art: "laptop", label: "private code", at: T.privat - 0.25, strike: T.privat + 0.2 }, { icon: "🎓", label: "practice projects", at: T.privat - 0.05, tick: T.off }] });
const cta = KF.make("ending-comment", "s6", { keyword: "FREE", pill: "for the setup + exact settings", dm: "Free Claude Code: setup, keys and settings 👇" });

// ---- sound cues ----
const cues = []; const cue = (type, t, o = {}) => cues.push({ type, t: +t.toFixed(3), ...o });
cue("riser", 0.05, { t2: 1.4 }); for (let k = 0; k < 10; k++) cue("tick", 0.2 + k * 0.12, { soft: true }); cue("impact", T.free1); cue("whoosh", T.heres); cue("pop", T.heres + 0.2); cue("pop", T.heres + 0.4, { soft: true });
cue("whoosh", S.s2[0]); cue("land", S.s2[0] + 0.35); for (let k = 0; k < 6; k++) cue("tick", T.repo - 0.4 + k * 0.15, { soft: true }); cue("ding", T.repo + 0.5); cue("pop", T.fcc); cue("swish", T.fcc + 0.3, { soft: true });
cue("tap", T.key); [T.nvidia, T.google, T.groq].forEach(x => { cue("pop", x); cue("swish", x + 0.2, { soft: true }); });
cue("whoosh", S.s4[0]); cue("type", T.s3 + 0.2, { t2: T.s3 + 0.8 }); [0, 1, 2, 3].forEach(i => cue("tick", T.open + 0.3 + i * 0.45)); cue("ding", T.bill);
cue("impact", T.catch); cue("pop", T.brain); cue("glitch", T.notclaude); cue("swish", T.weaker, { soft: true }); cue("pop", T.code); cue("pop", T.code + 0.3); cue("glitch", T.privat + 0.1); cue("ding", T.off);
cue("swell", T.cta - 0.1); cue("type", T.cta + 0.4, { t2: T.cta + 0.8 }); cue("click", T.cta + 0.95); cue("ding", T.dm + 0.2);
W.forEach(x => { if (/[.!?]$/.test(x.w)) cue("tick", x.e + 0.02, { soft: true }); });
window.__cues = cues;

// ---- the frame ----
window.seek = t => {
  const on = k => t >= S[k][0] && t < S[k][1];
  ["s1", "s2", "s4", "s5", "s6"].forEach(k => { const e = $(k), a = S[k][0], b = S[k][1], v = on(k); e.style.display = v ? "" : "none";
    if (v) { const pin = E.out(P(t, a, 0.35)), pout = P(t, b - 0.25, 0.25); e.style.opacity = Math.min(pin * 1.4, 1 - pout); e.style.transform = `translateY(${((1 - pin) * 60 - pout * 40).toFixed(1)}px)`; } });
  $("red").style.opacity = P(t, T.catch - 0.15, 0.3) * (1 - P(t, T.cta - 0.2, 0.3));
  // hook: count up, then the question "what's actually answering?"
  if (on("s1")) { stat.frame(t, { p: P(t, 0.05, 3.3), show: 1 - P(t, T.heres - 0.2, 0.3) }); }
  // the pipeline: visible from "answering" until the catch, moves aside while the repo card / session are on screen
  const pv = t >= T.heres + 0.15 && t < S.s5[0], pe = $("pipe"); pe.style.display = pv ? "" : "none";
  if (pv) { const repoUp = t >= S.s2[0] && t < T.fcc - 0.2, sessUp = t >= S.s4[0]; pe.style.opacity = repoUp || sessUp ? 0 : 1 - P(t, S.s5[0] - 0.25, 0.25);
    pipe.frame(t, { active: t < T.fcc ? ["app"] : t < T.nvidia ? ["fcc"] : ["nv", "go", "gq"] }); qm.style.opacity = t < T.fcc - 0.2 ? P(t, T.heres + 0.35, 0.3) : 0; }
  if (t >= S.s2[0] && t < T.fcc - 0.2) { $("s2").style.display = ""; repo.frame(t, { show: P(t, S.s2[0], 0.6), count: E.inOut(P(t, T.repo - 0.6, 1.0)) }); $("s2").style.opacity = 1 - P(t, T.fcc - 0.45, 0.25); } else $("s2").style.display = "none";
  wipe.frame(t, { p: P(t, S.s4[0] - 0.3, 0.55) }); wipe2.frame(t, { p: P(t, S.s2[0] - 0.3, 0.55) });
  const dr = fin.drift(t, 0.9); $("world").style.transform = `translate(${dr[0].toFixed(1)}px,${dr[1].toFixed(1)}px) rotate(${dr[2].toFixed(3)}deg)`;
  const rk = t >= T.code - 0.3 && t < T.privat - 0.35; $("rackh").style.display = rk ? "" : "none"; if (rk) { rack.frame(t, { show: P(t, T.code - 0.3, 0.4), p: KF.prog(t, T.code - 0.1, (T.privat - T.code) * 0.9) }); $("rackh").style.opacity = 1 - P(t, T.privat - 0.6, 0.25); rackTag.style.opacity = P(t, T.company - 0.1, 0.3); }
  if (on("s4")) { sess.frame(t, { show: P(t, S.s4[0], 0.4), n: 4 * P(t, T.open, T.same - T.open + 0.4) }); bill.frame(t, { p: 1, show: E.back(P(t, T.zero - 0.15, 0.3)) }); }
  if (on("s5")) { brain.frame(t, { active: t >= T.brain ? ["m"] : ["app"] }); lab.frame(t); keep.frame(t); $("s5").querySelector("canvas").style.opacity = 1 - P(t, T.code - 0.35, 0.3); }
  if (on("s6")) cta.frame(t, { show: P(t, S.s6[0], 0.6), typed: P(t, T.cta + 0.4, 0.4), sent: P(t, T.cta + 0.9, 0.3), dm: P(t, T.dm + 0.1, 0.9) });
  const lb = KF.loopBack(t, DUR, 1.0); if (lb.mix > 0) { const e = $("s1"); e.style.display = ""; e.style.opacity = lb.mix; e.style.transform = "none"; stat.frame(0, { p: 1, show: 1 }); $("s6").style.opacity = 1 - lb.mix; }
  const ch = t < S.s2[0] ? 0.5 : t < S.s2[0] + (T.s2 - S.s2[0]) ? 1.5 : t < S.s4[0] ? 2.5 : t < S.s5[0] ? 3.5 : 4.5;
  rail.frame(t, { at: Math.min(ch, 4.9), alert: on("s5"), value: t < S.s2[0] ? 68932 : t < T.s2 ? 1 : t < S.s4[0] ? [T.nvidia, T.google, T.groq].filter(x => t >= x).length : t < S.s5[0] ? 0 : 2,
    label: t < S.s2[0] ? "★ stars" : t < T.s2 ? "repo" : t < S.s4[0] ? "free keys" : t < S.s5[0] ? "₹ bill" : "catches" });
  $("rail").style.opacity = t >= S.s6[0] ? 1 - P(t, S.s6[0], 0.3) : 1;
  cap.frame(t); pres.frame(t); fin.frame(t, { flash: Math.max(0, 0.22 * (1 - P(t, T.privat + 0.36, 0.12)) * (t >= T.privat + 0.36 ? 1 : 0)) });
  $("fn").textContent = t < S.s2[0] ? "★ checked 12 Nov 2026 · not affiliated with Anthropic" : t < T.s2 ? "github.com/Alishahryar1/free-claude-code" : t < S.s4[0] ? "Free limits are set by each provider and can change" : on("s4") ? "Sample session" : on("s5") ? "Pick a provider whose data rules you're OK with" : "";
};
window.seek(0);
</script></body></html>
