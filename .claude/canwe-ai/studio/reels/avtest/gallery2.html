<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="speedy.css">
<style>#av{position:absolute;left:140px;top:560px;width:800px;height:853px}#av svg{overflow:visible}.lab{position:absolute;left:0;right:0;top:250px;text-align:center;font:800 56px Inter;color:#fff}</style></head>
<body><div id="stage"><div class="lab" id="lab"></div><div id="av"></div></div>
<script src="engine.js"></script><script src="avatar.js"></script><script>
const q = new URLSearchParams((location.hash ? "?" + location.hash.slice(1) : location.search)), acc = q.get("acc") || "";
Avatar.init(document.getElementById("av"), { look: "street", accessory: acc });
const L = [["hold","paper"],["hold","phone"],["hold","chai"],["hold","magnifier"],["shades gag",""],["fx bulb",""],["fx q",""],["fx sweat",""],["fx spark",""],["fx steam",""],["shades_push",""],["finger_guns",""]];
window.seek = t => { const i = Math.min(L.length - 1, Math.floor(t)), [n, pr] = L[i], f = t - i;
  document.getElementById("lab").textContent = (acc ? acc + " · " : "") + n + (pr ? " · " + pr : "");
  const o = { beat: 0 };
  let pose = "talk";
  if (n === "hold") { pose = "hold"; o.prop = [pr, 1]; }
  else if (n === "shades gag") { pose = "hands_head"; o.shades = 1; }
  else if (n.startsWith("fx")) { pose = "talk"; o.fx = [[n.slice(3), 0.45]]; }
  else pose = n;
  Avatar.frame(t, pose, 1, pose, 0, o); };
window.seek(0);
</script></body></html>
