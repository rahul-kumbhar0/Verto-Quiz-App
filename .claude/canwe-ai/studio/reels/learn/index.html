const spr = (e, q, extra = "") => { e.style.opacity = Math.min(1, q * 2); e.style.transform = `${extra} scale(${(0.6 + 0.4 * q).toFixed(3)})`; };

window.seek = t => {
  const on = k => t >= S[k][0] && t < S[k][1];
  Object.keys(S).forEach(k => { const e = $(k), a = S[k][0], b = S[k][1], v = on(k); e.style.display = v ? "" : "none";
